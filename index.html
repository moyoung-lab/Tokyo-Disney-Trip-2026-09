<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>東京旅記 2026 (雲端版)</title>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <link rel="stylesheet" type="text/css" href="style.css" />
  </head>
  <body>
    <header>
      <div class="subtitle">TOKYO TRIP 202609</div>
      <h1 id="pageTitle">行程安排</h1>
    </header>

    <main class="hide-scrollbar">
      <div id="view-itinerary">
        <div class="date-scroll hide-scrollbar" id="dateContainer"></div>
        <div id="itineraryList"></div>
      </div>

      <div id="view-info" class="hidden">
        <div class="card">
          <div
            style="
              font-size: 12px;
              color: #a8a29e;
              font-weight: bold;
              margin-bottom: 12px;
            "
          >
            航班資訊 FLIGHT
          </div>
          <div
            style="
              display: flex;
              justify-content: space-between;
              align-items: center;
              text-align: center;
            "
          >
            <div>
              <div style="font-size: 20px; font-weight: bold">TPE</div>
              <div style="font-size: 12px; color: #78716c">08:30</div>
            </div>
            <div
              style="
                flex: 1;
                border-bottom: 1px solid #d6d3d1;
                position: relative;
                margin: 0 20px;
              "
            >
              <div
                style="
                  position: absolute;
                  top: -10px;
                  left: 50%;
                  transform: translateX(-50%);
                  background: #fff;
                  padding: 0 4px;
                  color: #a8a29e;
                  font-size: 10px;
                "
              >
                JX800
              </div>
            </div>
            <div>
              <div style="font-size: 20px; font-weight: bold">NRT</div>
              <div style="font-size: 12px; color: #78716c">13:10</div>
            </div>
          </div>
        </div>
        <div class="card">
          <div
            style="
              font-size: 12px;
              color: #a8a29e;
              font-weight: bold;
              margin-bottom: 12px;
            "
          >
            住宿 HOTEL
          </div>
          <div style="font-weight: bold; font-size: 16px">東京灣希爾頓飯店</div>
          <div style="font-size: 12px; color: #78716c; margin-bottom: 12px">
            千葉県浦安市舞浜1-8
          </div>
        </div>
      </div>

      <div id="view-budget" class="hidden">
        <div class="card budget-card">
          <div style="font-size: 10px; opacity: 0.7; letter-spacing: 1px">
            TOTAL EXPENSE (TWD)
          </div>
          <div class="budget-amount" id="totalAmount">讀取中...</div>
          <div
            style="
              font-size: 12px;
              opacity: 0.7;
              border-top: 1px solid rgba(255, 255, 255, 0.2);
              padding-top: 12px;
              display: flex;
              justify-content: space-between;
            "
          >
            <span>預算剩餘</span>
            <span id="remainAmount">...</span>
          </div>
        </div>

        <div class="card">
          <div class="input-group">
            <input
              type="text"
              id="expenseName"
              class="input-field"
              placeholder="項目 (例: 拉麵)"
              style="flex: 2"
            />
            <input
              type="number"
              id="expenseCost"
              class="input-field"
              placeholder="金額"
              style="flex: 1"
            />
          </div>
          <button onclick="addExpense()" class="btn btn-primary">
            新增支出
          </button>
        </div>

        <div id="expenseList"></div>
      </div>
    </main>

    <nav>
      <button class="tab-btn active" onclick="switchTab('itinerary', this)">
        <svg class="tab-icon" viewBox="0 0 24 24">
          <path
            d="M12 2C7.589 2 4 5.589 4 9.995 3.971 16.44 11.696 21.784 12 22c0 0 8.029-5.56 8-12 0-4.411-3.589-8-8-8zm0 12c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4z"
          />
        </svg>
        <span class="tab-label">行程</span>
      </button>
      <button class="tab-btn" onclick="switchTab('info', this)">
        <svg class="tab-icon" viewBox="0 0 24 24">
          <path
            d="M20 6h-3V4c0-1.103-.897-2-2-2H9c-1.103 0-2 .897-2 2v2H4c-1.103 0-2 .897-2 2v11c0 1.103.897 2 2 2h16c1.103 0 2-.897 2-2V8c0-1.103-.897-2-2-2zM9 4h6v2H9V4zm11 15H4V8h16v11z"
          />
        </svg>
        <span class="tab-label">資訊</span>
      </button>
      <button class="tab-btn" onclick="switchTab('budget', this)">
        <svg class="tab-icon" viewBox="0 0 24 24">
          <path
            d="M12 2C6.486 2 2 6.486 2 12s4.486 10 10 10 10-4.486 10-10S17.514 2 12 2zm0 18c-4.411 0-8-3.589-8-8s3.589-8 8-8 8 3.589 8 8-3.589 8-8 8zm.002-14c-3.313 0-6 2.687-6 6 0 .796.158 1.551.442 2.247l1.639-1.638A4.015 4.015 0 0 1 8.002 12c0-2.206 1.794-4 4-4 1.956 0 3.582 1.405 3.916 3.259l1.621-1.621C16.637 6.649 14.509 4 12.002 4z"
          />
        </svg>
        <span class="tab-label">記帳</span>
      </button>
    </nav>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="app.js"></script>
  </body>
</html>
